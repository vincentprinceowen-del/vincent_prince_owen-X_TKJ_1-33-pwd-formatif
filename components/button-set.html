<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Set</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: #222222;
            font-size: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            object-position: center;
        }
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: rgb(99, 255, 154);
            color: rgb(0, 0, 0);
        }
        .btn-secondary {
            background-color: lightgreen;
        }
        .btn-outline {
            background-color: greenyellow;
            border: 2px solid grey;
        }
        .btn-send {
            background-color: green;
            color: rgb(174, 255, 178);
        }
        .btn-secondary,
        .btn-outline {
            color: #222222;
        }
        .btn-primary:hover,
        .btn-primary.forced-hover {
            background-color: #5dff5d;
        }

        .btn-secondary:hover,
        .btn-secondary.forced-hover {
            background-color: green;
        }

        .btn-outline:hover,
        .btn-outline.forced-hover {
            background-color: rgb(76, 255, 76);
        }

        .btn-send:hover,
        .btn-send.forced-hover {
            background-color: rgb(15, 71, 32);
        }

    </style>
</head>
<body style="background-color: rgb(193, 228, 194);">
    <main>
        <h2 style="color:  #51713d;">normal</h2>
        <div class="button-group">
            <a class="btn btn-primary">Lihat Proyek</a>
            <a class="btn btn-secondary">Unduh CV</a>
            <a class="btn btn-outline">Hubungi Saya</a>
            <a class="btn btn-send">Kirim Pesan</a>
        </div>
        <h2 style="color: #5e8545;">hover</h2>
        <div class="button-group">
            <a class="btn btn-primary forced-hover">Lihat Proyek</a>
            <a class="btn btn-secondary forced-hover">Unduh CV</a>
            <a class="btn btn-outline forced-hover">Hubungi Saya</a>
            <a class="btn btn-send forced-hover">Kirim Pesan</a>
        </div>
    </main>
    <footer>
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
