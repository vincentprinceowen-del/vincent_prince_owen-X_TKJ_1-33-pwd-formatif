<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: rgb(193, 228, 194);
            font-family: Arial, sans-serif;
        }
        main {
            padding: 20px;
        }
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #596854;
            margin: 30px auto;
            border-radius: 12px;
            background-color: white;
        }
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }
        .card h3 {
            color:#364b27;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 15px;
            line-height: 1.6;
            color: #6d9a51;
        }
        .card a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 20px;
        }
        footer a {
            color: #333333;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="/assets/images/proyek.jpg" alt="Gambar Proyek">
            <h3>Website toko online</h3>
            <p>
               proyek latihan membuat website toko online sederhana menggunakan HTML dan CSS.
            </p>
            <a>Lihat Proyek</a>
        </div>
    </main>
    <footer>
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
