<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(193, 228, 194);
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background-color: #379248;
            padding: 25px 20px;
            box-sizing: border-box;
        }
        .sidebar h2 {
            color: white;
            margin-top: 0;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar li {
            margin-bottom: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
        }
        .sidebar a:hover {
            color: #000000;
        }
        main {
            flex: 1;
            padding: 30px;
        }
        .content {
            background-color: rgb(248, 255, 243);
            padding: 25px;
            border-radius: 8px;
        }
      
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a>Beranda</a></li>
                <li><a>Profil</a></li>
                <li><a>Proyek</a></li>
                <li><a>Kontak</a></li>
            </ul>
        </aside>
        <main>
        <div class="content">
            <h1>Selamat Datang</h1>
            <p>selamat datang di website ini</p>
            <section id="profil">
                <h2>Profil</h2>
                <p>ini adalah website uji coba untuk belajar HTML.</p>
            </section>
            <section id="proyek">
                <h2>Proyek Saya</h2>
                <p>membuat website ini.</p>
            </section>
            <section id="kontak">
                <h2>Kontak</h2>
                <p>tidak ada.</p>
            </section>
        </div>
        <footer>
            <a href="../index.html">Kembali ke Beranda</a>
        </footer>
        </main>
    </div>
</body>
</html>
