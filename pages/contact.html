<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family:'Times New Roman', Times, serif;
            background-color: rgb(193, 228, 194);
        }
        #contact {
            padding: 40px 20px;
        }
        .contact-form {
            width: 400px;
            margin: auto;
            padding: 24px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: rgb(239, 255, 231);
        }
        .contact-form h2 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #9bb39f;
            border-radius: 6px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00ff80;
            background-color: #effff1;
        }
        .form-group textarea:focus {
            border-color: #00ff80;
            background-color: #effff1;
        }
        .btn-submit {
            background-color: #00ff80;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #00924e;
        }
        a {
            display: block;
            width: 200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama ">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email ">
            </div>
            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan "></textarea>
            </div>
            <button type="submit" class="btn-submit">Kirim</button>
        </form>
    </section>
    <a href="../index.html">Kembali ke Beranda</a>
</body>
</html>
